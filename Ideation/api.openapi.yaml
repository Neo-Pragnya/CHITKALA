openapi: 3.1.0
info:
  title: CHITKALA Optional Service API
  version: 0.1.0-proposal
  description: >-
    Proposed optional local/self-hosted HTTP surface. Desktop primarily uses
    typed Tauri IPC with equivalent domain contracts. No deployment implied.
servers:
  - url: http://127.0.0.1:8765/v1
    description: Developer-only local transport; must require an auth boundary when enabled.
tags:
  - name: Vaults
  - name: Documents
  - name: Search
  - name: Agents
  - name: Publishing
  - name: Library
    description: Knowledge Pack catalog, install grants and updates (see CHITKALA_KNOWLEDGE_PACKS_AND_TEXTBOOKS.md)
  - name: Publishers
  - name: Books
paths:
  /vaults/{vaultId}/documents/{documentId}:
    get:
      tags: [Documents]
      operationId: readDocument
      summary: Read a vault-scoped document and its current revision
      parameters:
        - $ref: '#/components/parameters/VaultId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Authorized document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /search:
    post:
      tags: [Search]
      operationId: searchVault
      summary: Search a vault under caller's read scopes
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchRequest'}
      responses:
        '200':
          description: Search results with revision anchors
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    items: {$ref: '#/components/schemas/SearchHit'}
                required: [hits]
        '403': {$ref: '#/components/responses/Forbidden'}
  /patches:
    post:
      tags: [Documents]
      operationId: proposePatch
      summary: Stage an edit; does not change canonical files
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatchProposalRequest'}
      responses:
        '201':
          description: Created proposal awaiting review
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatchProposal'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /patches/{proposalId}/apply:
    post:
      tags: [Documents]
      operationId: applyApprovedPatch
      summary: Apply a human-approved patch using revision compare-and-swap
      description: >-
        Local/self-hosted transport only, where the server process owns the vault. A cloud deployment never
        applies patches; the desktop commits locally and posts an apply-receipt instead.
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewerId: {type: string}
                approvedProposalHash: {type: string}
              required: [reviewerId, approvedProposalHash]
      responses:
        '200':
          description: Atomic commit created
          content:
            application/json:
              schema:
                type: object
                properties:
                  committedRevision: {type: string}
                  documentId: {type: string}
                required: [committedRevision, documentId]
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /agent-runs:
    post:
      tags: [Agents]
      operationId: createAgentRun
      summary: Start budgeted workflow under explicit capability grants
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vaultId: {type: string}
                agentId: {type: string}
                goal: {type: string}
                scopeIds:
                  type: array
                  items: {type: string}
              required: [vaultId, agentId, goal, scopeIds]
      responses:
        '202':
          description: Accepted; may await permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId: {type: string}
                  status: {type: string}
                required: [runId, status]
        '403': {$ref: '#/components/responses/Forbidden'}
  /agent-runs/{runId}/events:
    get:
      tags: [Agents]
      operationId: getAgentEvents
      summary: SSE stream of authorized agent run events
      parameters:
        - name: runId
          in: path
          required: true
          schema: {type: string}
        - name: afterSequence
          in: query
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Agent event stream
          content:
            text/event-stream:
              schema: {type: string}
        '403': {$ref: '#/components/responses/Forbidden'}
  /publications/previews:
    post:
      tags: [Publishing]
      operationId: buildPublishPreview
      summary: Create a public-only build preview; never deploys
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vaultId: {type: string}
                manifestHash: {type: string}
              required: [vaultId, manifestHash]
      responses:
        '202':
          description: Preview build accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  previewId: {type: string}
                  status: {type: string}
                required: [previewId, status]
        '403': {$ref: '#/components/responses/Forbidden'}
  /patches/{proposalId}/apply-receipt:
    post:
      tags: [Documents]
      operationId: recordPatchApplied
      summary: Cloud deployments - the desktop reports a patch it committed locally; resumes the waiting agent run
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approvedProposalHash: {type: string}
                committedRevision: {type: string}
                documentId: {type: string}
              required: [approvedProposalHash, committedRevision, documentId]
      responses:
        '200': {description: Receipt recorded}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /library/catalog:
    get:
      tags: [Library]
      operationId: listCatalog
      summary: Browse or search packs visible to the caller (static registries serve catalog.json instead)
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: profile, in: query, schema: {$ref: '#/components/schemas/PackProfile'}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: Catalog page
          content:
            application/json:
              schema:
                type: object
                properties:
                  packs:
                    type: array
                    items: {$ref: '#/components/schemas/PackSummary'}
                  nextCursor: {type: string}
                required: [packs]
  /library/packs/{packId}/editions/{edition}:
    get:
      tags: [Library]
      operationId: getPackEdition
      summary: Manifest, signature, partitions, errata and entitlement status of one edition
      parameters:
        - $ref: '#/components/parameters/PackId'
        - $ref: '#/components/parameters/Edition'
      responses:
        '200':
          description: Edition details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackEdition'}
        '404': {$ref: '#/components/responses/NotFound'}
  /library/packs/{packId}/editions/{edition}/install-grants:
    post:
      tags: [Library]
      operationId: createInstallGrant
      summary: Check entitlement and return a short-lived download grant for the chosen partitions
      parameters:
        - $ref: '#/components/parameters/PackId'
        - $ref: '#/components/parameters/Edition'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                partitions:
                  type: array
                  items: {type: string}
                fromRevision: {type: string, description: Installed revision, to receive a delta}
              required: [deviceId]
      responses:
        '201':
          description: Download grant (signed URLs/cookies scoped to this edition's files)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallGrant'}
        '402': {description: Entitlement required}
        '403': {$ref: '#/components/responses/Forbidden'}
  /library/updates:
    post:
      tags: [Library]
      operationId: checkLibraryUpdates
      summary: Report installed pack revisions; returns available revisions and errata (with severity)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                installed:
                  type: array
                  items:
                    type: object
                    properties:
                      packId: {type: string}
                      edition: {type: string}
                      revision: {type: string}
                    required: [packId, edition, revision]
              required: [installed]
      responses:
        '200':
          description: Available updates
          content:
            application/json:
              schema:
                type: object
                properties:
                  updates:
                    type: array
                    items: {$ref: '#/components/schemas/PackUpdate'}
                required: [updates]
  /library/packs/{packId}/editions/{edition}/ask:
    post:
      tags: [Library]
      operationId: askPack
      summary: Hosted "ask this book" - answers only from this edition, with pinned citations or an abstention
      parameters:
        - $ref: '#/components/parameters/PackId'
        - $ref: '#/components/parameters/Edition'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question: {type: string, minLength: 1, maxLength: 4000}
                partitions:
                  type: array
                  items: {type: string}
              required: [question]
      responses:
        '200':
          description: Cited answer or abstention
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer: {type: string}
                  abstained: {type: boolean}
                  disclaimer: {type: string}
                  citations:
                    type: array
                    items: {$ref: '#/components/schemas/PackCitation'}
                required: [abstained, citations]
        '429': {description: Rate limit or budget exhausted}
  /publishers/packs/{packId}/editions/{edition}/uploads:
    post:
      tags: [Publishers]
      operationId: createPackUpload
      summary: Start uploading a signed pack edition (returns presigned URLs for missing content-addressed files)
      parameters:
        - $ref: '#/components/parameters/PackId'
        - $ref: '#/components/parameters/Edition'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revision: {type: string}
                manifestHash: {type: string}
                filesDigest: {type: string}
                fileHashes:
                  type: array
                  items: {type: string}
              required: [revision, manifestHash, filesDigest, fileHashes]
      responses:
        '201': {description: Upload session with presigned URLs}
        '403': {$ref: '#/components/responses/Forbidden'}
  /publishers/packs/{packId}/editions/{edition}/submissions:
    post:
      tags: [Publishers]
      operationId: submitPackEdition
      summary: Validate (signature, schema, profile rules, PHI and privacy scans) and list in the catalog when it passes
      parameters:
        - $ref: '#/components/parameters/PackId'
        - $ref: '#/components/parameters/Edition'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revision: {type: string}
                erratumSeverity: {type: string, enum: [none, editorial, content, safety-critical]}
                notes: {type: string}
              required: [revision]
      responses:
        '202': {description: Validation started; findings are reported as events}
        '403': {$ref: '#/components/responses/Forbidden'}
  /books/{bookId}/builds:
    post:
      tags: [Books]
      operationId: createBookBuild
      summary: Managed build of site, PDF, EPUB and pack from an uploaded, allowlisted book bundle
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                edition: {type: string}
                revision: {type: string}
                bundleManifestHash: {type: string}
                outputs:
                  type: array
                  items: {type: string, enum: [site, pdf, epub, pack]}
              required: [edition, bundleManifestHash, outputs]
      responses:
        '202':
          description: Build accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  buildId: {type: string}
                  status: {type: string}
                required: [buildId, status]
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  parameters:
    VaultId:
      name: vaultId
      in: path
      required: true
      schema: {type: string}
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: {type: string}
    PackId:
      name: packId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9]+([.][a-z0-9-]+)+$'}
    Edition:
      name: edition
      in: path
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
  schemas:
    Error:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
        retryable: {type: boolean}
      required: [code, message, retryable]
    Document:
      type: object
      properties:
        vaultId: {type: string}
        documentId: {type: string}
        path: {type: string}
        format: {type: string, enum: [md, mdx, html, canvas, other]}
        revision: {type: string}
        content: {type: string}
      required: [vaultId, documentId, path, format, revision, content]
    SearchRequest:
      type: object
      properties:
        vaultId: {type: string}
        query: {type: string, minLength: 1}
        mode: {type: string, enum: [lexical, semantic, hybrid, graph]}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
        includeCitations: {type: boolean, default: true}
      required: [vaultId, query, mode]
    SourceCitation:
      type: object
      properties:
        documentId: {type: string}
        revision: {type: string}
        chunkId: {type: string}
        startByte: {type: integer, minimum: 0}
        endByte: {type: integer, minimum: 1}
        quotedTextHash: {type: string}
      required: [documentId, revision, chunkId, startByte, endByte, quotedTextHash]
    SearchHit:
      type: object
      properties:
        documentId: {type: string}
        title: {type: string}
        path: {type: string}
        revision: {type: string}
        score: {type: number}
        citation: {$ref: '#/components/schemas/SourceCitation'}
      required: [documentId, title, path, revision, score]
    PatchProposalRequest:
      type: object
      properties:
        vaultId: {type: string}
        documentId: {type: string}
        baseRevision: {type: string}
        operation: {type: string, enum: [create-file, replace-section, edit-range, rename]}
        newMarkdown: {type: string}
      required: [vaultId, baseRevision, operation]
    PatchProposal:
      type: object
      properties:
        proposalId: {type: string}
        proposalHash: {type: string}
        status: {type: string, enum: [pending, approved, rejected, expired, committed, conflict]}
      required: [proposalId, proposalHash, status]
    PackProfile:
      type: string
      enum: [textbook, reference, course, repository, medical]
    PackSummary:
      type: object
      properties:
        packId: {type: string}
        title: {type: string}
        profile: {$ref: '#/components/schemas/PackProfile'}
        publisherKeyId: {type: string}
        entitlement: {type: string, enum: [open, registered, paid, institutional]}
        aiPolicy: {type: string, enum: [local-only, external-with-consent, publisher-hosted-only]}
        currentEdition: {type: string}
      required: [packId, title, profile, publisherKeyId, entitlement, aiPolicy]
    PackEdition:
      type: object
      properties:
        packId: {type: string}
        edition: {type: string}
        latestRevision: {type: string}
        status: {type: string, enum: [current, superseded, retired]}
        manifestUrl: {type: string}
        signatureUrl: {type: string}
        bytes: {type: integer, minimum: 0}
        partitions:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              title: {type: string}
              documents: {type: integer}
            required: [id, title]
        entitled: {type: boolean}
      required: [packId, edition, latestRevision, status, manifestUrl, signatureUrl]
    InstallGrant:
      type: object
      properties:
        grantId: {type: string}
        baseUrl: {type: string}
        expiresAt: {type: string, format: date-time}
        files:
          type: array
          description: Content-addressed files to fetch (a delta when fromRevision was given)
          items: {type: string}
        leaseExpiresAt: {type: string, format: date-time}
      required: [grantId, baseUrl, expiresAt, files]
    PackUpdate:
      type: object
      properties:
        packId: {type: string}
        edition: {type: string}
        fromRevision: {type: string}
        toRevision: {type: string}
        severity: {type: string, enum: [editorial, content, safety-critical]}
        summary: {type: string}
      required: [packId, edition, fromRevision, toRevision, severity]
    PackCitation:
      type: object
      properties:
        packId: {type: string}
        edition: {type: string}
        revision: {type: string}
        documentId: {type: string}
        headingPath:
          type: array
          items: {type: string}
        startByte: {type: integer, minimum: 0}
        endByte: {type: integer, minimum: 1}
        quotedTextHash: {type: string}
      required: [packId, edition, revision, documentId, startByte, endByte, quotedTextHash]
  responses:
    Forbidden:
      description: Caller lacks capability grant
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found or not visible to caller
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Revision changed or proposal is no longer valid
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
